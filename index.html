<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.4">
    <title>Financial Kinematics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="dashboard">
        <div class="header-stats">
            <div class="stat-card">
                <h3 data-tooltip="Your total projected real wealth (purchasing power) at the selected milestone year.">Balance (Pos)</h3>
                <p id="balDisp" class="color-pos">$0</p>
            </div>
            <div class="stat-card">
                <h3 data-tooltip="The annual rate at which your wealth is expanding at this exact point in time (the instantaneous slope of the curve).">Velocity (Slope)</h3>
                <p id="velDisp" class="color-vel">$0/yr</p>
            </div>
            <div class="stat-card">
                <h3 data-tooltip="The compound acceleration rate of your wealth, showing how fast your velocity is speeding up due to interest compounding on interest.">Acceleration</h3>
                <p id="accDisp" class="color-acc">$0/yr²</p>
            </div>
            <div class="stat-card">
                <h3 data-tooltip="The calculated timeframe required for your real wealth accumulation curve to reach your green target milestone line.">Years to Target</h3>
                <p id="targetDisp" class="color-target">--</p>
            </div>
        </div>

        <div class="main-content">
            <div class="chart-container">
                <canvas id="mainChart"></canvas>
            </div>
            
            <div class="side-controls">
                <div id="graphTooltipBox" class="external-tooltip-box">
                    <h4>Data Insights</h4>
                    <p class="placeholder-text">Hover over any data track on the graph to display timeline metrics.</p>
                </div>

                <div class="slider-box">
                    <div class="label-row">
                        <label class="label-text" data-tooltip="Introduces market variance via Monte Carlo simulation. Creates a shaded band comprising a 90% probability spread. For example, setting this to 5% means there is a 90% chance your returns fall between the 5th and 95th percentiles based on a 5% standard deviation around your nominal rate.">Market Volatility (σ %):</label>
                        <input type="number" id="volInput" class="num-input" step="0.5" value="0" min="0" max="25">
                    </div>
                    <input type="range" id="volSlider" min="0" max="25" step="0.5" value="0">
                </div>
            </div>
        </div>

        <div class="controls">
            <div class="slider-box">
                <div class="label-row">
                    <label class="label-text" data-tooltip="The specific future milestone year you want to isolate on the chart and calculate exact position stats for.">Time (Years):</label>
                    <input type="number" id="yearInput" class="num-input" value="5">
                </div>
                <input type="range" id="yearSlider" min="0" max="40" step="0.1" value="5">
            </div>
            
            <div class="slider-box">
                <div class="label-row">
                    <label class="label-text" data-tooltip="The expected average annual growth rate generated by your investments.">Nominal Return (%):</label>
                    <input type="number" id="rateInput" class="num-input" value="6.5">
                </div>
                <input type="range" id="rateSlider" min="1" max="15" step="0.1" value="6.5">
            </div>

            <div class="slider-box">
                <div class="label-row">
                    <label class="label-text" data-tooltip="The annual rate at which your purchasing power erodes. Subtracted from returns to show real wealth values.">Inflation Drag (%):</label>
                    <input type="number" id="infInput" class="num-input" step="0.1" value="3">
                </div>
                <input type="range" id="infSlider" min="0" max="10" step="0.1" value="3">
            </div>

            <div class="slider-box">
                <div class="label-row">
                    <label class="label-text" data-tooltip="Your starting investment portfolio balance at Year 0. Adjusts using arrows in steps of $1,000.">Initial Principal ($):</label>
                    <input type="number" id="principalInput" class="num-input" step="1000" value="0">
                </div>
                <input type="range" id="principalSlider" min="0" max="1000000" step="1000" value="0">
            </div>

            <div class="slider-box">
                <div class="label-row">
                    <label class="label-text" data-tooltip="The cash amount you plan to consistently save and contribute to your portfolio at the end of every month.">Monthly Deposit ($):</label>
                    <input type="number" id="depositInput" class="num-input" step="100" value="2000">
                </div>
                <input type="range" id="depositSlider" min="0" max="10000" step="100" value="2000">
            </div>

            <div class="slider-box">
                <div class="label-row">
                    <label class="label-text" data-tooltip="Your target net worth milestone. Calculates exactly when your blue real wealth curve intersects this line.">Target Wealth ($):</label>
                    <input type="number" id="targetInput" class="num-input" step="10000" value="1000000">
                </div>
                <input type="range" id="targetSlider" min="0" max="10000000" step="10000" value="1000000">
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
