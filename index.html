<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=0.4">
    <title>Financial Kinematics</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
<div class="dashboard">
    <div class="header-stats">
        <div class="stat-card">
            <h3>Balance (Pos)</h3>
            <p id="balDisp" class="color-pos">$0</p>
        </div>
        <div class="stat-card">
            <h3>Velocity (Slope)</h3>
            <p id="velDisp" class="color-vel">$0/yr</p>
        </div>
        <div class="stat-card premium-locked">
            <h3>Acceleration 🔒</h3>
            <p class="color-acc">--/yr²</p>
        </div>
        <div class="stat-card premium-locked">
            <h3>Years to Target 🔒</h3>
            <p class="color-target">--</p>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="mainChart"></canvas>
    </div>

    <div class="controls">
        <div class="slider-box">
            <div class="label-row">
                <label class="label-text" for="yearInput">Time (Years):</label>
                <input type="number" id="yearInput" class="num-input" min="0" max="40" step="0.5" value="5">
            </div>
            <input type="range" id="yearSlider" min="0" max="40" step="0.5" value="5">
        </div>
        
        <div class="slider-box">
            <div class="label-row">
                <label class="label-text" for="rateInput">Nominal Return (%):</label>
                <input type="number" id="rateInput" class="num-input" min="1" max="15" step="0.1" value="6.5">
            </div>
            <input type="range" id="rateSlider" min="1" max="15" step="0.1" value="6.5">
        </div>

        <div class="slider-box">
            <div class="label-row">
                <label class="label-text" for="principalInput">Initial Principal ($):</label>
                <input type="number" id="principalInput" class="num-input" min="0" max="1000000" step="1000" value="0">
            </div>
            <input type="range" id="principalSlider" min="0" max="1000000" step="1000" value="0">
        </div>

        <div class="slider-box">
            <div class="label-row">
                <label class="label-text" for="depositInput">Monthly Deposit ($):</label>
                <input type="number" id="depositInput" class="num-input" min="0" max="10000" step="100" value="2000">
            </div>
            <input type="range" id="depositSlider" min="0" max="10000" step="100" value="2000">
        </div>

        <div class="slider-box premium-locked">
            <div class="label-row">
                <label class="label-text">Inflation Drag (%): 🔒</label>
                <input type="number" class="num-input" step="0.1" value="3" disabled>
            </div>
            <input type="range" min="0" max="10" step="0.1" value="3" disabled>
        </div>

        <div class="slider-box premium-locked">
            <div class="label-row">
                <label class="label-text">Target Wealth ($): 🔒</label>
                <input type="number" class="num-input" step="10000" value="1000000" disabled>
            </div>
            <input type="range" min="0" max="10000000" step="10000" value="1000000" disabled>
        </div>
    </div>
</div>

<div id="premiumModal" class="modal-overlay">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <img src="premium-preview.png" alt="Premium Features Preview" class="premium-img">
        
        <h2>Unlock Premium</h2>
        <p>Unlock deeper insights like historical inflation backtesting, Monte Carlo market volatility, and personalized target goals for <strong>$4.99/month</strong>.</p>
        <button class="upgrade-btn">Upgrade Now</button>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="script.js"></script>
</body>
</html>
