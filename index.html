<div class="dashboard">
    <div class="header-stats">
        <div class="stat-card">
            <h3>Balance (Pos)</h3>
            <p id="balDisp" class="color-pos">$0</p>
        </div>
        <div class="stat-card">
            <h3>Velocity (Slope)</h3>
            <p id="velDisp" class="color-vel">$0/yr</p>
        </div>
    </div>

    <div class="chart-container">
        <canvas id="mainChart"></canvas>
    </div>

    <div class="controls">
        <div class="slider-box">
            <div class="label-row">
                <label class="label-text" for="yearInput">Time (Years):</label>
                <input type="number" id="yearInput" class="num-input" min="0" max="40" step="0.5" value="5">
            </div>
            <input type="range" id="yearSlider" min="0" max="40" step="0.5" value="5">
        </div>
        
        <div class="slider-box">
            <div class="label-row">
                <label class="label-text" for="rateInput">Nominal Return (%):</label>
                <input type="number" id="rateInput" class="num-input" min="1" max="15" step="0.1" value="6.5">
            </div>
            <input type="range" id="rateSlider" min="1" max="15" step="0.1" value="6.5">
        </div>

        <div class="slider-box">
            <div class="label-row">
                <label class="label-text" for="principalInput">Initial Principal ($):</label>
                <input type="number" id="principalInput" class="num-input" min="0" max="1000000" step="1000" value="0">
            </div>
            <input type="range" id="principalSlider" min="0" max="1000000" step="1000" value="0">
        </div>

        <div class="slider-box">
            <div class="label-row">
                <label class="label-text" for="depositInput">Monthly Deposit ($):</label>
                <input type="number" id="depositInput" class="num-input" min="0" max="10000" step="100" value="2000">
            </div>
            <input type="range" id="depositSlider" min="0" max="10000" step="100" value="2000">
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
